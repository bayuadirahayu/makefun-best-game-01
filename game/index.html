<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberfall — Dive of the Last Lantern</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02080d; }
  /* The game is a fixed 1280x720 stage, letterboxed to any window. The
     WebGL canvas paints the 3D diorama below; the 2D canvas above it holds
     the HUD, the screens and the particles, over a transparent background. */
  #gl, #game {
    position: fixed;
    left: 50%; top: 50%;
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    transform: translate(-50%, -50%);
    display: block;
  }
  #gl { z-index: 0; pointer-events: none; }
  #game { z-index: 1; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="gl" width="1280" height="720" aria-hidden="true"></canvas>
<canvas id="game" width="1280" height="720" aria-label="Emberfall: steer the last lantern down the cave, collect light shards, dodge rock and wisps, and reach the Heart Chamber at 1000 metres"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
